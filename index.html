<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee | Promoções e Ofertas</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/icon.png">
  <meta name="description" content="Shopee: compre com frete grátis, cupons de desconto, moedas e ofertas relâmpago.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kulim+Park:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="home">
  <header id="topo" class="topo"></header>

  <main class="container">
    <section class="promo" aria-label="Promoções e ofertas">
      <span class="promo__rotulo">PROMOÇÕES E OFERTAS</span>
      <div class="carrossel" id="carrossel">
        <div class="carrossel__trilho"></div>
        <button class="carrossel__seta carrossel__seta--esq" aria-label="Anterior"></button>
        <button class="carrossel__seta carrossel__seta--dir" aria-label="Próximo"></button>
      </div>
      <div class="pontos" id="pontos" role="tablist" aria-label="Escolher banner"></div>
    </section>

    <nav class="atalhos" id="atalhos" aria-label="Atalhos"></nav>

    <section aria-labelledby="titulo-relampago">
      <div class="relampago-topo">
        <h2 id="titulo-relampago"><a href="oferta-relampago.html">Ofertas Relâmpago</a></h2>
        <div class="contagem"><span data-icone="clock"></span> Termina em: <strong id="contagem">00:00:00</strong></div>
      </div>
      <div class="faixa-relampago">
        <div class="faixa-relampago__trilho" id="faixa-relampago"></div>
        <button class="faixa-relampago__seta faixa-relampago__seta--esq oculto" data-rolar="-1" aria-label="Voltar"></button>
        <button class="faixa-relampago__seta" data-rolar="1" aria-label="Avançar"></button>
      </div>
    </section>

    <section aria-labelledby="titulo-recomendados">
      <h2 class="secao-titulo" id="titulo-recomendados">Recomendados <span class="secao-titulo__barra"></span></h2>
      <div class="lista-produtos" id="recomendados"></div>
      <div class="carregar-mais"><button class="botao botao--contorno" id="ver-mais">Ver mais produtos</button></div>
    </section>
  </main>

  <footer id="rodape"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
