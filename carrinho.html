<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho de Compras | Shopee</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon.png">
  <meta name="description" content="Shopee: compre com frete grátis, cupons de desconto, moedas e ofertas relâmpago.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kulim+Park:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="carrinho">
  <header id="topo" class="topo"></header>

  <main class="container">
    <h1 class="titulo-pagina"><span data-icone="cart"></span> Carrinho de Compras</h1>
    <div class="cartao carrinho-cabecalho">
      <label><input type="checkbox" class="check" id="selecionar-tudo"> Produtos</label>
      <span>Preço Unitário</span><span>Quantidade</span><span>Preço Total</span><span>Ações</span>
    </div>
    <div id="lista-carrinho"></div>
    <div class="cartao resumo-fixo" id="resumo-carrinho">
      <label><input type="checkbox" class="check" id="selecionar-tudo-2"> Selecionar tudo</label>
      <button class="botao-excluir" id="excluir-selecionados">Excluir selecionados</button>
      <div class="total">Total (<span id="qtd-selecionada">0</span> itens): <strong id="total-carrinho">R$ 0,00</strong></div>
      <button class="botao botao--primario" id="continuar">Continuar</button>
    </div>
  </main>

  <footer id="rodape"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/carrinho.js"></script>
</body>
</html>
